<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ferrum Point of Sale: A till that keeps selling when the connection drops, priced by the server's own engine.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#391f15"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ed6c29"/><stop offset="1" stop-color="#d7510b"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ea580c" fill-opacity="0.16"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.45"/></filter>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .sheen { animation: sweep 9s ease-in-out infinite; }
      .tile { animation: float 7s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-480px) skewX(-18deg); } 60%, 100% { transform: translateX(1760px) skewX(-18deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .sheen, .tile { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <circle cx="1150" cy="20" r="230" fill="#ea580c" fill-opacity="0.1"/>
    <circle cx="1240" cy="350" r="150" fill="#ea580c" fill-opacity="0.08"/>
    <rect class="sheen" x="0" y="-60" width="260" height="480" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#30363d"/>
  <g class="tile"><g transform="translate(72 102)" filter="url(#shadow)"><rect width="144" height="144" rx="36" fill="url(#tile)"/><g transform="translate(36 36) scale(3)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></g></g></g>
  <text x="264" y="138" font-size="17" font-weight="700" fill="#f29b6d" letter-spacing="2.4">FERRUM APP</text>
  <text x="262" y="198" font-size="58" font-weight="750" fill="#e6edf3" letter-spacing="-1">Ferrum Point of Sale</text>
  <text x="264" y="244" font-size="23" fill="#9da7b3">A till that keeps selling when the connection drops,</text>
  <text x="264" y="278" font-size="23" fill="#9da7b3">priced by the server's own engine.</text>
  <g><rect x="264" y="310" width="70" height="30" rx="15" fill="#4b2514"/><text x="298.8" y="330" font-size="14.5" font-weight="600" fill="#f3a379" text-anchor="middle">v0.2.2</text></g>
  <g><rect x="343.6" y="310" width="130" height="30" rx="15" fill="#4b2514"/><text x="408.5" y="330" font-size="14.5" font-weight="600" fill="#f3a379" text-anchor="middle">Own interface</text></g>
  <g><rect x="483.40000000000003" y="310" width="113" height="30" rx="15" fill="#4b2514"/><text x="539.7" y="330" font-size="14.5" font-weight="600" fill="#f3a379" text-anchor="middle">Installable</text></g>
  <g><rect x="606" y="310" width="87" height="30" rx="15" fill="#4b2514"/><text x="649.4" y="330" font-size="14.5" font-weight="600" fill="#f3a379" text-anchor="middle">AGPL-3.0</text></g>
</svg>
