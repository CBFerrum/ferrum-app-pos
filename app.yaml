id: pos
name: Point of Sale
version: 0.7.1
publisher: cbferrum
summary: Registers, sessions, offline-safe sales with split payments, tax invoices, receipts, promotions, returns, loyalty, cash management and closing into the books
description: README.md
categories: [pos, sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-pos
support: https://github.com/CBFerrum/ferrum-app-pos/issues
runtime: native
platform: ">=0.3.1, <0.4"
# Records of ERP (items, customers, accounts, stock): installing it installs ERP.
requires: {erp: ">=0.22"}
packages: [pos]
uninstall: ask
# Its own interface at /pos/ (Ferrum docs/plan/apps-ui.md §13): the till, full screen and working
# offline under its own worker (ui/public/sw.js, served at /pos/sw.js), and its records.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - {id: pos, route: pos, title: Point of Sale, description: "The till, online or offline", icon: store, color: "#ea580c", compact: true, installable: true, roles: [Cashier, POS Manager]}
  # Registers, sessions, sales, closings and loyalty open in the register's records.
  shell.open:
    - {id: pos, package: pos, path: "pos/e/{entity}/{id}", list: "pos/e/{entity}"}
  # What the assistant should know in Point of Sale's pages, and what it suggests asking there.
  shell.assistant:
    - id: pos
      title: "Point of Sale"
      instructions: >-
        A register's session opens with a PosOpeningEntry and closes into the books with a PosClosingEntry, which
        counts the cash by denomination. A PosInvoice is Paid, Unpaid, a Return, or Consolidated once its session is
        closed into ERP's invoices; its payment may be split across modes. Loyalty points are earned and redeemed
        under a LoyaltyProgram.
      suggestions:
        - "What did each register sell today?"
        - "Which sessions are still open?"
        - "How many returns were there this week?"
